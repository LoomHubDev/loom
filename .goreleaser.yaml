version: 2

builds:
  - id: loom
    main: ./cmd/loom
    binary: loom
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

  - id: loom-server
    main: ./cmd/loom-server
    binary: loom-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - id: default
    formats: ['tar.gz']
    name_template: "loom_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - ids: [loom]
    repository:
      owner: LoomHubDev
      name: homebrew-tap
    directory: Formula
    homepage: "https://loomhub.dev"
    description: "Continuous, intelligent, multi-space versioning system"
    license: "MIT"
    install: |
      bin.install "loom"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: LoomHubDev
    name: loom

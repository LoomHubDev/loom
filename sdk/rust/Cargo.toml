[package]
name = "loom-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Loom versioning system"
license = "MIT"
repository = "https://github.com/LoomHubDev/loom"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

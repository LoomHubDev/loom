[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "loom-sdk"
version = "0.1.0"
description = "Python SDK for Loom versioning system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["httpx>=0.25.0"]

[project.urls]
Homepage = "https://loomhub.dev"
Repository = "https://github.com/LoomHubDev/loom"
